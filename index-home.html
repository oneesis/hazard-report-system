<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Beranda - ONE-SAP</title>
<link rel="icon" href="assets/Logo EBL.png" type="image/png" />
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="home.css">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
</head>
<body>

<div class="app-layout">
  <aside id="appSidebar" class="app-sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app-main">

    <!-- Mobile topbar -->
    <div class="app-topbar">
      <button class="app-topbar-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <span id="appTopbarTitle" class="app-topbar-title">Beranda</span>
      <div id="notificationBell"></div>
      <div id="userProfile" class="user-menu"></div>
    </div>

    <!-- PAGE CONTENT -->
    <div class="home-content">

      <!-- GREETING -->
      <div class="home-greeting">
        <div class="home-greeting-text">
          <p class="greeting-day" id="greetingDay"></p>
          <h1 class="greeting-name" id="greetingName">Selamat Datang</h1>
          <p class="greeting-sync" id="greetingSync">
            <i class="fa-solid fa-circle-check" style="color:#22c55e;font-size:.7rem"></i>
            Data siap digunakan
          </p>
        </div>
        <div class="greeting-user-badge" id="greetingBadge"></div>
      </div>

      <!-- ACTION BANNER: tampil jika ada laporan yang butuh tindakan -->
      <div id="actionBanner" style="display:none"></div>

      <!-- MODULE BAR: 5 modul sebagai ikon (klik → slide-down) -->
      <div class="mod-bar" id="modBar">
        <button type="button" class="mod-btn" data-mod="hr" onclick="toggleModule('hr')" aria-expanded="false">
          <span class="mod-ic ic-hr"><i class="fa-solid fa-triangle-exclamation"></i></span>
          <span class="mod-badge" data-badge="hr" hidden></span>
          <span class="mod-lbl">Hazard</span>
          <i class="fa-solid fa-chevron-down mod-chev"></i>
        </button>
        <button type="button" class="mod-btn" data-mod="ins" onclick="toggleModule('ins')" aria-expanded="false">
          <span class="mod-ic ic-ins"><i class="fa-solid fa-clipboard-check"></i></span>
          <span class="mod-lbl">Inspeksi</span>
          <i class="fa-solid fa-chevron-down mod-chev"></i>
        </button>
        <button type="button" class="mod-btn" data-mod="sbo" onclick="toggleModule('sbo')" aria-expanded="false">
          <span class="mod-ic ic-sbo"><i class="fa-solid fa-eye"></i></span>
          <span class="mod-lbl">SBO</span>
          <i class="fa-solid fa-chevron-down mod-chev"></i>
        </button>
        <button type="button" class="mod-btn" data-mod="pc" onclick="toggleModule('pc')" aria-expanded="false">
          <span class="mod-ic ic-pc"><i class="fa-solid fa-comments"></i></span>
          <span class="mod-lbl">PC</span>
          <i class="fa-solid fa-chevron-down mod-chev"></i>
        </button>
        <button type="button" class="mod-btn" data-mod="st" onclick="toggleModule('st')" aria-expanded="false">
          <span class="mod-ic ic-st"><i class="fa-solid fa-bullhorn"></i></span>
          <span class="mod-badge" data-badge="st" hidden></span>
          <span class="mod-lbl">Safety Talk</span>
          <i class="fa-solid fa-chevron-down mod-chev"></i>
        </button>
      </div>

      <!-- PANEL EXPAND per modul (accordion) -->
      <div class="mod-panel" id="modPanel-hr">
        <div class="mod-panel-in">
          <a href="index.html" class="mod-act act-hr"><i class="fa-solid fa-plus"></i> Buat Laporan Hazard</a>
          <a href="dashboard.html" class="mod-act"><i class="fa-solid fa-list-ul"></i> Lihat Laporan Saya</a>
          <div id="hazardDraftSection" style="display:none;margin-top:4px">
            <div class="hazard-draft-label"><i class="fa-solid fa-pen-to-square"></i> Draft Tersimpan</div>
            <div id="hazardDraftCard"></div>
          </div>
        </div>
      </div>

      <div class="mod-panel" id="modPanel-ins">
        <div class="mod-panel-in">
          <div class="ins-grid" id="insGrid"><!-- rendered by home.js --></div>
          <a href="inspection.html" class="mod-act" style="margin-top:10px"><i class="fa-solid fa-list-ul"></i> Lihat Semua Inspeksi</a>
        </div>
      </div>

      <div class="mod-panel" id="modPanel-sbo">
        <div class="mod-panel-in">
          <a href="sbo-form.html" class="mod-act act-sbo"><i class="fa-solid fa-plus"></i> Buat Observasi (SBO)</a>
          <a href="sbo.html" class="mod-act"><i class="fa-solid fa-list-ul"></i> Lihat Semua SBO</a>
        </div>
      </div>

      <div class="mod-panel" id="modPanel-pc">
        <div class="mod-panel-in">
          <a href="pc-form.html" class="mod-act act-pc"><i class="fa-solid fa-plus"></i> Buat Personal Contact</a>
          <a href="pc.html" class="mod-act"><i class="fa-solid fa-list-ul"></i> Lihat Semua PC</a>
        </div>
      </div>

      <div class="mod-panel" id="modPanel-st">
        <div class="mod-panel-in">
          <div id="penggantiST"><!-- rendered by home.js: riwayat ST + tombol kuis --></div>
        </div>
      </div>

      <!-- SAP ACHIEVEMENT (ringkas) -->
      <div id="sapAchievement" style="display:none"></div>

      <!-- RINGKASAN LAPORAN (ringkas) -->
      <div class="sum-card">
        <p class="quick-stats-label">RINGKASAN LAPORAN SAYA</p>
        <div class="quick-stats-grid" id="quickStatsGrid">
          <div class="quick-stat"><div class="quick-stat-num" id="qsTotal">-</div><div class="quick-stat-desc">Total</div></div>
          <div class="quick-stat"><div class="quick-stat-num qs-open" id="qsOpen">-</div><div class="quick-stat-desc">Open</div></div>
          <div class="quick-stat"><div class="quick-stat-num qs-closed" id="qsClosed">-</div><div class="quick-stat-desc">Closed</div></div>
          <div class="quick-stat"><div class="quick-stat-num qs-overdue" id="qsOverdue">-</div><div class="quick-stat-desc">Overdue</div></div>
        </div>
      </div>

      <!-- LAPORAN TERAKHIR (ringkas) -->
      <div class="my-reports-card">
        <div class="my-reports-header">
          <h3><i class="fa-solid fa-clock-rotate-left"></i> Laporan Terakhir Saya</h3>
        </div>
        <div class="my-reports-list" id="myReportsList">
          <div class="skeleton-report-item"><div class="sk sk-dot"></div><div class="sk-body"><div class="sk sk-id"></div><div class="sk sk-desc"></div></div><div class="sk sk-badge"></div></div>
          <div class="skeleton-report-item"><div class="sk sk-dot"></div><div class="sk-body"><div class="sk sk-id"></div><div class="sk sk-desc"></div></div><div class="sk sk-badge"></div></div>
          <div class="skeleton-report-item"><div class="sk sk-dot"></div><div class="sk-body"><div class="sk sk-id"></div><div class="sk sk-desc"></div></div><div class="sk sk-badge"></div></div>
        </div>
        <a href="dashboard.html" class="btn-see-all">
          Lihat Semua Riwayat <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>

    </div><!-- end home-content -->

    <nav id="mobileBottomNav" class="mobile-bottom-nav"></nav>

  </div><!-- end app-main -->
</div><!-- end app-layout -->

<div id="toast" class="toast"></div>

<script src="auth.js"></script>
<script src="layout.js"></script>
<script src="push-notif.js"></script>
<script src="reports-utils.js"></script>
<script src="notifications.js"></script>
<script src="offline-sync.js"></script>
<script src="home.js"></script>
<script>
  requireLogin();
  window.addEventListener('DOMContentLoaded', () => {
    renderUserProfile();
  });
</script>
</body>
</html>
