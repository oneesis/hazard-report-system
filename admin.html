<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen User - ONE-SAP</title>
  <link rel="icon" href="./assets/Logo EBL.png" type="image/png" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="app-layout admin-layout">

  <aside id="appSidebar" class="app-sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <main class="app-main admin-main">

    <header class="admin-topbar">
      <button class="app-topbar-toggle sidebar-toggle" onclick="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
      </button>
      <h1 class="admin-page-title" id="adminPageTitle">Manajemen User</h1>
      <div id="userProfile" class="user-menu"></div>
    </header>

    <!-- Sub-nav tabs -->
    <div class="admin-subnav" id="adminSubnav">
      <button class="admin-subnav-btn active" data-section="sectionUsers" onclick="showSection('sectionUsers', this)">
        <i class="fa-solid fa-users-gear"></i> Manajemen User
      </button>
      <button class="admin-subnav-btn" data-section="sectionHistory" onclick="showSection('sectionHistory', this)" id="sidebarHistory" style="display:none">
        <i class="fa-solid fa-clock-rotate-left"></i> Riwayat Pengajuan
      </button>
      <button class="admin-subnav-btn" data-section="sectionPending" onclick="showSection('sectionPending', this)" id="sidebarPending" style="display:none">
        <i class="fa-solid fa-clock"></i> Pending Approval
        <span class="sidebar-badge" id="pendingBadge" style="display:none">0</span>
      </button>
    </div>

    <!-- MANAJEMEN USER -->
    <section id="sectionUsers" class="admin-section">
      <div class="um-header">
        <input type="text" id="umSearch" placeholder="Cari nama, NIK, departemen..." class="um-search">
        <div class="um-header-actions">
          <button class="btn-secondary" onclick="downloadCsvTemplate()" title="Download template CSV">
            <i class="fa-solid fa-file-arrow-down"></i> Template CSV
          </button>
          <button class="btn-secondary" onclick="triggerCsvImport()" title="Import dari CSV">
            <i class="fa-solid fa-file-import"></i> Import CSV
          </button>
          <button class="btn-primary" onclick="openAddUser()">
            <i class="fa-solid fa-user-plus"></i> Tambah User
          </button>
          <button class="btn-secondary btn-icon" onclick="loadUsers()" title="Refresh">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
        </div>
      </div>

      <div class="admin-card" style="overflow-x:auto">
        <table id="umTable" class="admin-table">
          <thead>
            <tr>
              <th>Perusahaan</th><th>Nama</th><th>NIK</th><th>Jabatan</th>
              <th>Departemen</th><th>WhatsApp</th>
              <th class="um-center">OBJ HR</th><th class="um-center">OBJ INS</th>
              <th class="um-center">OBJ SBO</th><th class="um-center">OBJ PC</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="umTableBody">
            <tr><td colspan="11" class="um-loading">Memuat data...</td></tr>
          </tbody>
        </table>
        <div id="umPagination" class="table-pagination"></div>
      </div>
    </section>

    <!-- RIWAYAT PENGAJUAN (all admin roles) -->
    <section id="sectionHistory" class="admin-section" style="display:none">
      <div class="um-header">
        <span style="font-size:.85rem;color:#64748b">Riwayat perubahan yang Anda ajukan</span>
        <div class="um-header-actions">
          <button class="btn-secondary" onclick="loadMyHistory()">
            <i class="fa-solid fa-arrows-rotate"></i> Refresh
          </button>
        </div>
      </div>
      <div class="admin-card">
        <div id="umHistorySection"><p class="um-empty">Memuat...</p></div>
      </div>
    </section>

    <!-- PENDING APPROVAL (SUPER_ADMIN only) -->
    <section id="sectionPending" class="admin-section" style="display:none">
      <div class="um-header">
        <span style="font-size:.85rem;color:#64748b">Permohonan perubahan yang menunggu persetujuan</span>
        <div class="um-header-actions">
          <button class="btn-secondary" onclick="loadPendingChanges()">
            <i class="fa-solid fa-arrows-rotate"></i> Refresh
          </button>
        </div>
      </div>
      <div class="admin-card">
        <div id="umPendingSection"><p class="um-empty">Memuat...</p></div>
      </div>
    </section>

    <!-- hidden file input for CSV import -->
    <input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="handleCsvFile(this)">

  </main>
</div>

<script src="auth.js"></script>
<script src="layout.js"></script>
<script src="user-management.js"></script>
<script>
  requireLogin();

  window.addEventListener('DOMContentLoaded', () => {
    const user = getCurrentUser();
    if (!isAdminOrAbove(user?.role)) {
      window.location.href = 'index-home.html';
      return;
    }
    renderUserProfile();
    // Riwayat tab: semua admin dan super admin
    document.getElementById('sidebarHistory').style.display = 'flex';
    // Pending tab: hanya SUPER_ADMIN
    if (isSuperAdminRole(user?.role)) {
      document.getElementById('sidebarPending').style.display = 'flex';
    }
    initUserManagement();
  });

  function showSection(sectionId, btn) {
    document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none');
    document.querySelectorAll('.admin-subnav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(sectionId).style.display = 'block';
    btn.classList.add('active');
    const titles = {
      sectionUsers:   'Manajemen User',
      sectionHistory: 'Riwayat Pengajuan',
      sectionPending: 'Pending Approval',
    };
    document.getElementById('adminPageTitle').textContent = titles[sectionId] || '';
    if (sectionId === 'sectionPending') loadPendingChanges();
    if (sectionId === 'sectionHistory') loadMyHistory();
  }
</script>
</body>
</html>
