<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - ONE-SAP</title>
  <link rel="icon" href="./assets/Logo EBL.png" type="image/png" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="app-layout admin-layout">

  <!-- SIDEBAR (shared) -->
  <aside id="appSidebar" class="app-sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <!-- MAIN CONTENT -->
  <main class="app-main admin-main">

    <!-- TOP BAR -->
    <header class="admin-topbar">
      <button class="app-topbar-toggle sidebar-toggle" onclick="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
      </button>
      <h1 class="admin-page-title" id="adminPageTitle">Manajemen User</h1>
      <div id="userProfile" class="user-menu"></div>
    </header>

    <!-- Admin sub-nav (tabs within admin section) -->
    <div class="admin-subnav" id="adminSubnav" style="padding:0 24px 0;display:flex;gap:8px;background:#fff;border-bottom:1px solid #e2e8f0;">
      <button class="sidebar-item admin-subnav-btn active" data-section="sectionUsers" onclick="showSection('sectionUsers', this)" style="border-radius:0;border-bottom:3px solid #F2A900;padding:12px 16px;color:#00205B;background:none;">
        <i class="fa-solid fa-users-gear"></i>
        <span>Manajemen User</span>
      </button>
      <button class="sidebar-item admin-subnav-btn" data-section="sectionPending" onclick="showSection('sectionPending', this)" id="sidebarPending" style="display:none;border-radius:0;border-bottom:3px solid transparent;padding:12px 16px;color:#64748b;background:none;">
        <i class="fa-solid fa-clock"></i>
        <span>Pending Approval</span>
        <span class="sidebar-badge" id="pendingBadge" style="display:none">0</span>
      </button>
    </div>

    <!-- MANAJEMEN USER -->
    <section id="sectionUsers" class="admin-section">
      <div class="um-header">
        <div class="um-header-actions">
          <input type="text" id="umSearch" placeholder="Cari nama, NIK, departemen..." class="um-search">
          <button class="btn-primary" onclick="openAddUser()">
            <i class="fa-solid fa-user-plus"></i> Tambah User
          </button>
          <button class="btn-secondary" onclick="loadUsers()">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
        </div>
      </div>

      <div class="admin-card" style="overflow-x:auto">
        <table id="umTable" class="admin-table">
          <thead>
            <tr>
              <th>Perusahaan</th><th>Nama</th><th>NIK</th><th>Jabatan</th>
              <th>Departemen</th><th>WhatsApp</th>
              <th class="um-center">OBJ HR</th><th class="um-center">OBJ INS</th>
              <th class="um-center">OBJ SBO</th><th class="um-center">OBJ PC</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="umTableBody">
            <tr><td colspan="11" class="um-loading">Memuat data...</td></tr>
          </tbody>
        </table>
        <div id="umPagination" class="table-pagination"></div>
      </div>
    </section>

    <!-- PENDING APPROVAL (SUPER_ADMIN only) -->
    <section id="sectionPending" class="admin-section" style="display:none">
      <div class="um-header">
        <div class="um-header-actions">
          <button class="btn-secondary" onclick="loadPendingChanges()">
            <i class="fa-solid fa-arrows-rotate"></i> Refresh
          </button>
        </div>
      </div>
      <div class="admin-card">
        <div id="umPendingSection"><p class="um-empty">Memuat...</p></div>
      </div>
    </section>

  </main>
</div>

<script src="auth.js"></script>
<script src="layout.js"></script>
<script src="user-management.js"></script>
<script>
  requireLogin();

  window.addEventListener('DOMContentLoaded', () => {
    const user = getCurrentUser();
    // Hanya ADMIN dan SUPER_ADMIN yang boleh masuk
    if (!isAdminOrAbove(user?.role)) {
      window.location.href = 'index-home.html';
      return;
    }
    renderUserProfile();
    if (isSuperAdminRole(user?.role)) {
      document.getElementById('sidebarPending').style.display = 'flex';
    }
    initUserManagement();
  });

  function showSection(sectionId, btn) {
    document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none');
    document.querySelectorAll('.admin-subnav-btn').forEach(b => {
      b.classList.remove('active');
      b.style.borderBottomColor = 'transparent';
      b.style.color = '#64748b';
    });
    document.getElementById(sectionId).style.display = 'block';
    btn.classList.add('active');
    btn.style.borderBottomColor = '#F2A900';
    btn.style.color = '#00205B';
    const titles = { sectionUsers: 'Manajemen User', sectionPending: 'Pending Approval' };
    document.getElementById('adminPageTitle').textContent = titles[sectionId] || '';
    if (sectionId === 'sectionPending') loadPendingChanges();
  }
</script>
</body>
</html>
