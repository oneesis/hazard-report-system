<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe Behavior Observation - ONE-SAP</title>
  <link rel="icon" href="assets/Logo EBL.png" type="image/png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .sbo-page { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .sbo-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .sbo-title { font-size: 1.25rem; font-weight: 800; color: #0f172a; letter-spacing: -.02em; }
    .sbo-sub { font-size: .82rem; color: #64748b; margin-top: 2px; }
    .sbo-filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .sbo-filters select, .sbo-filters input { padding: 8px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: .85rem; color: #0f172a; background: #fff; }
    .sbo-kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    @media (max-width: 600px) { .sbo-kpi { grid-template-columns: 1fr 1fr; } .sbo-page { padding: 14px; } }
    .sbo-kpi-card { background: #fff; border: 1.5px solid #f1f5f9; border-radius: 12px; padding: 14px 18px; }
    .sbo-kpi-label { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; margin-bottom: 4px; }
    .sbo-kpi-val { font-size: 1.6rem; font-weight: 800; color: #0f172a; }
    .sbo-kpi-card.aman .sbo-kpi-val { color: #16a34a; }
    .sbo-kpi-card.open .sbo-kpi-val { color: #dc2626; }
    .sbo-table-wrap { overflow-x: auto; border-radius: 12px; border: 1.5px solid #f1f5f9; }
    .sbo-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    .sbo-table th { background: #f8fafc; padding: 10px 12px; text-align: left; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #64748b; border-bottom: 1.5px solid #f1f5f9; white-space: nowrap; }
    .sbo-table td { padding: 10px 12px; border-bottom: 1px solid #f8fafc; color: #1e293b; vertical-align: middle; }
    .sbo-table tr:last-child td { border-bottom: none; }
    .sbo-table tr:hover td { background: #f8fafc; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 99px; font-size: .72rem; font-weight: 700; white-space: nowrap; }
    .badge-aman { background: #dcfce7; color: #15803d; }
    .badge-open { background: #fee2e2; color: #dc2626; }
    .badge-closed { background: #e0e7ff; color: #4338ca; }
    .badge-followup { background: #fef9c3; color: #a16207; }
    .sbo-empty { text-align: center; padding: 48px 24px; color: #94a3b8; }
    .sbo-empty i { font-size: 2rem; margin-bottom: 12px; display: block; }
    .sbo-pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-size: .82rem; color: #64748b; }
    .sbo-pagination button { padding: 6px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px; background: #fff; cursor: pointer; font-size: .82rem; }
    .sbo-pagination button:disabled { opacity: .4; cursor: not-allowed; }
    .btn-sbo-new { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; background: linear-gradient(135deg,#6366f1,#4f46e5); color: #fff; border: none; border-radius: 10px; font-size: .85rem; font-weight: 700; cursor: pointer; text-decoration: none; }
    .btn-sbo-new:hover { opacity: .9; }
    .sbo-detail-btn { background: none; border: 1.5px solid #e2e8f0; border-radius: 7px; padding: 5px 10px; cursor: pointer; font-size: .8rem; color: #6366f1; font-weight: 600; }
    .sbo-detail-btn:hover { background: #eef2ff; border-color: #6366f1; }

    /* Modal detail */
    .sbo-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 9000; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .sbo-modal { background: #fff; border-radius: 16px; max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .sbo-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid #f1f5f9; }
    .sbo-modal-title { font-size: 1rem; font-weight: 800; color: #0f172a; }
    .sbo-modal-close { background: none; border: none; cursor: pointer; color: #94a3b8; font-size: 1.1rem; }
    .sbo-modal-body { padding: 20px; }
    .sbo-dl { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .sbo-dl-item { display: flex; flex-direction: column; gap: 2px; }
    .sbo-dl-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; }
    .sbo-dl-val { font-size: .88rem; color: #0f172a; font-weight: 500; word-break: break-all; }
    .sbo-section-sep { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #94a3b8; margin: 18px 0 10px; grid-column: 1/-1; }
    .checklist-display { font-size: .8rem; }
    .checklist-display .item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #f1f5f9; }
    .checklist-display .item:last-child { border-bottom: none; }
    .cat-title { font-weight: 700; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: #475569; margin: 12px 0 6px; }
    .val-aman { color: #16a34a; font-weight: 700; }
    .val-tidak { color: #dc2626; font-weight: 700; }
    .val-na { color: #94a3b8; }
    .sbo-modal-footer { padding: 14px 20px; border-top: 1px solid #f1f5f9; display: flex; gap: 10px; justify-content: flex-end; }

    /* Update form */
    .sbo-update-section { background: #f8fafc; border-radius: 10px; padding: 16px; margin-top: 16px; }
    .sbo-update-section h4 { font-size: .82rem; font-weight: 700; color: #0f172a; margin-bottom: 12px; }
    .sbo-update-section textarea { width: 100%; border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 9px 12px; font-size: .85rem; resize: vertical; min-height: 72px; }
    .sbo-update-section input[type=file] { font-size: .82rem; }
  </style>
</head>
<body>

<div class="app-layout">
  <aside id="appSidebar" class="app-sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app-main">
    <div class="app-topbar">
      <button class="app-topbar-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <span id="appTopbarTitle" class="app-topbar-title">SBO</span>
      <div id="notificationBell"></div>
      <div id="userProfile" class="user-menu"></div>
    </div>

    <div class="sbo-page">
      <div class="sbo-header">
        <div>
          <div class="sbo-title"><i class="fa-solid fa-eye" style="color:#6366f1;margin-right:8px"></i>Safe Behavior Observation</div>
          <div class="sbo-sub">Observasi perilaku keselamatan kerja di lapangan</div>
        </div>
        <a href="sbo-form.html" class="btn-sbo-new"><i class="fa-solid fa-plus"></i> Buat Laporan SBO</a>
      </div>

      <div class="sbo-kpi" id="sboKpi">
        <div class="sbo-kpi-card"><div class="sbo-kpi-label">Total Laporan</div><div class="sbo-kpi-val" id="kpiTotal">—</div></div>
        <div class="sbo-kpi-card aman"><div class="sbo-kpi-label">Semua Aman</div><div class="sbo-kpi-val" id="kpiAman">—</div></div>
        <div class="sbo-kpi-card open"><div class="sbo-kpi-label">Ada Temuan (Open)</div><div class="sbo-kpi-val" id="kpiOpen">—</div></div>
      </div>

      <div class="sbo-filters">
        <select id="sboFilterBulan" onchange="sboRender()">
          <option value="">Semua Bulan</option>
        </select>
        <select id="sboFilterStatus" onchange="sboRender()">
          <option value="">Semua Status</option>
          <option value="AMAN">Aman</option>
          <option value="OPEN">Open</option>
          <option value="FOLLOWUP">Follow Up</option>
          <option value="CLOSED">Closed</option>
        </select>
        <select id="sboFilterPerusahaan" style="display:none" onchange="sboRender()">
          <option value="">Semua Perusahaan</option>
        </select>
        <input id="sboFilterSearch" type="text" placeholder="Cari nama / ID..." oninput="sboRender()" style="flex:1;min-width:160px">
      </div>

      <div class="sbo-table-wrap">
        <table class="sbo-table">
          <thead id="sboThead">
            <tr>
              <th>ID</th><th>Tanggal</th><th>Observer</th><th>Observee</th>
              <th>Nama Pekerjaan</th><th>Status</th><th>Aksi</th>
            </tr>
          </thead>
          <tbody id="sboTbody"><tr><td colspan="7" class="sbo-empty"><i class="fa-solid fa-spinner fa-spin"></i>Memuat...</td></tr></tbody>
        </table>
      </div>
      <div class="sbo-pagination" id="sboPagination" style="display:none">
        <span id="sboPagInfo"></span>
        <div style="display:flex;gap:6px">
          <button onclick="sboPageNav(-1)" id="sboBtnPrev">‹ Prev</button>
          <button onclick="sboPageNav(1)" id="sboBtnNext">Next ›</button>
        </div>
      </div>
    </div>

    <nav id="mobileBottomNav" class="mobile-bottom-nav"></nav>
  </div>
</div>

<!-- Modal Detail -->
<div id="sboModal" class="sbo-modal-overlay" style="display:none" onclick="if(event.target===this)closeSboModal()">
  <div class="sbo-modal">
    <div class="sbo-modal-header">
      <div class="sbo-modal-title" id="sboModalTitle">Detail SBO</div>
      <button class="sbo-modal-close" onclick="closeSboModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="sbo-modal-body" id="sboModalBody"></div>
    <div class="sbo-modal-footer" id="sboModalFooter"></div>
  </div>
</div>

<script src="auth.js"></script>
<script src="layout.js"></script>
<script src="push-notif.js"></script>
<script src="reports-utils.js"></script>
<script src="notifications.js"></script>
<script src="offline-sync.js"></script>
<script src="sbo.js"></script>
</body>
</html>
