name: Keep Neon warm

# Menghangatkan database Neon (cegah cold-start scale-to-zero) HANYA di jam kerja.
# Neon Free tidur setelah ~5 menit idle; ping tiap 5 menit membuatnya tetap bangun
# selama jam kerja, lalu dibiarkan tidur di malam hari agar jatah compute tak habis.
#
# Jadwal cron GitHub Actions memakai UTC. WIB = UTC+7, jadi:
#   UTC jam 23 dan 0..11  ==  WIB ~06:00 s/d ~18:59
on:
  schedule:
    - cron: '*/5 0-11,23 * * *'   # tiap 5 menit, ~06:00-19:00 WIB, setiap hari
  workflow_dispatch:               # tombol jalankan manual di tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ONE-SAP (wake Neon)
        run: curl -fsS "https://sap-ebl.vercel.app/api?action=ping" && echo
