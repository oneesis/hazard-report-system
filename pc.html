<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Personal Contact - ONE-SAP</title>
<link rel="icon" href="assets/Logo EBL.png" type="image/png" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="home.css" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  .pc-page { max-width: 860px; margin: 0 auto; padding: 16px 16px 80px; }

  .pc-page-head {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px; margin-bottom: 16px;
  }
  .pc-page-title { font-size: 1.1rem; font-weight: 800; color: #0f766e; display:flex; align-items:center; gap:8px; }
  .pc-new-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px; background: linear-gradient(135deg,#0f766e,#0d9488);
    color: #fff; border-radius: 10px; font-size: .85rem; font-weight: 700;
    text-decoration: none; white-space: nowrap;
  }

  /* Filter bar */
  .pc-filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .pc-filter-bar input, .pc-filter-bar select {
    padding: 8px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: .85rem; flex: 1; min-width: 120px;
  }

  /* Cards */
  .pc-card {
    background: #fff; border-radius: 14px; border: 1.5px solid #e2e8f0;
    padding: 16px; margin-bottom: 12px; transition: box-shadow .15s;
  }
  .pc-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.07); }

  .pc-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .pc-card-id  { font-size: .75rem; font-weight: 700; color: #0d9488; letter-spacing:.04em; }
  .pc-card-title { font-size: .95rem; font-weight: 700; color: #1e293b; margin-top: 2px; }
  .pc-card-meta { font-size: .78rem; color: #64748b; margin-top: 6px; display:flex; flex-wrap:wrap; gap:10px; }
  .pc-card-meta i { color: #0d9488; }

  /* Status badge */
  .pc-badge {
    padding: 4px 10px; border-radius: 20px; font-size: .72rem; font-weight: 700;
    white-space: nowrap; flex-shrink: 0;
  }
  .pc-badge.open   { background: #fef3c7; color: #92400e; }
  .pc-badge.closed { background: #d1fae5; color: #065f46; }

  .pc-card-actions { display: flex; gap: 8px; margin-top: 12px; }
  .pc-btn-detail {
    padding: 7px 14px; background: #f0fdf4; color: #0f766e;
    border: 1.5px solid #a7f3d0; border-radius: 8px; font-size: .8rem;
    font-weight: 600; cursor: pointer;
  }
  .pc-btn-komitmen {
    padding: 7px 14px; background: linear-gradient(135deg,#0f766e,#0d9488);
    color: #fff; border: none; border-radius: 8px; font-size: .8rem;
    font-weight: 600; cursor: pointer;
  }

  /* Modal detail / komitmen */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: flex-start; justify-content: center;
    z-index: 9999; padding: 20px; overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff; border-radius: 20px; padding: 28px 24px;
    max-width: 520px; width: 100%; margin: auto;
  }
  .modal-box-title { font-size: 1rem; font-weight: 800; color: #0f766e; margin-bottom: 16px; }
  .modal-row { display: flex; gap: 8px; margin-bottom: 10px; font-size: .85rem; }
  .modal-row-label { font-weight: 700; color: #475569; min-width: 140px; flex-shrink:0; }
  .modal-row-value { color: #1e293b; flex: 1; }
  .modal-close-btn {
    margin-top: 16px; padding: 10px; width: 100%; border: 1.5px solid #e2e8f0;
    border-radius: 8px; background: #fff; color: #475569; cursor: pointer; font-size: .85rem;
  }

  .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; font-size: .9rem; }
  .loading-state { text-align: center; padding: 40px; color: #94a3b8; }
</style>
</head>
<body>
<div class="app-layout">
  <aside id="appSidebar" class="app-sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <div class="app-main">
    <div class="app-topbar">
      <button class="app-topbar-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <span class="app-topbar-title">Personal Contact</span>
      <div id="notificationBell"></div>
      <div id="userProfile" class="user-menu"></div>
    </div>

    <div class="pc-page">

      <div class="pc-page-head">
        <div class="pc-page-title"><i class="fa-solid fa-comments"></i> Personal Contact</div>
        <a href="pc-form.html" class="pc-new-btn"><i class="fa-solid fa-plus"></i> Buat PC Baru</a>
      </div>

      <!-- Filter -->
      <div class="pc-filter-bar">
        <input type="search" id="pcSearch" placeholder="Cari nama, judul, ID..." oninput="renderPcList()" />
        <select id="pcFilterStatus" onchange="renderPcList()">
          <option value="">Semua Status</option>
          <option value="OPEN">Open</option>
          <option value="CLOSED">Closed</option>
        </select>
        <select id="pcFilterTopik" onchange="renderPcList()">
          <option value="">Semua Topik</option>
          <option value="Pekerjaan">Pekerjaan</option>
          <option value="Pribadi">Pribadi</option>
        </select>
      </div>

      <div id="pcList" class="loading-state">
        <i class="fa-solid fa-spinner fa-spin"></i> Memuat data...
      </div>

    </div><!-- end pc-page -->
    <nav id="mobileBottomNav" class="mobile-bottom-nav"></nav>
  </div>
</div>

<!-- Modal Detail -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <div class="modal-box-title"><i class="fa-solid fa-comments"></i> Detail Personal Contact</div>
    <div id="detailContent"></div>
    <button class="modal-close-btn" onclick="closeDetailModal()">Tutup</button>
  </div>
</div>

<!-- Modal Konfirmasi Komitmen -->
<div class="modal-overlay" id="komitmenModal">
  <div class="modal-box">
    <div class="modal-box-title"><i class="fa-solid fa-handshake"></i> Konfirmasi Komitmen</div>
    <p style="font-size:.85rem;color:#64748b;margin-bottom:14px">
      Upload foto bukti dan konfirmasi bahwa kamu telah melaksanakan komitmen perbaikan.
    </p>
    <input type="hidden" id="komitmenPcId" />
    <div class="form-group">
      <label>Foto Bukti <span class="required">*</span></label>
      <input type="file" id="fotoBukti" accept="image/*" multiple onchange="onBuktiFotoChange(this)" />
      <div id="buktiFotoPreview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>
    </div>
    <div class="form-group">
      <label>Pesan / Keterangan</label>
      <textarea id="pesanKomitmen" rows="2" placeholder="Opsional — tuliskan keterangan singkat..."></textarea>
    </div>
    <div id="komitmenErrMsg" style="color:#dc2626;font-size:.82rem;display:none;margin-bottom:8px"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button onclick="closeKomitmenModal()" style="flex:1;padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer;font-size:.85rem">Batal</button>
      <button onclick="submitKomitmen()" id="komitmenSubmitBtn" style="flex:2;padding:10px;background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:.85rem">
        <i class="fa-solid fa-check"></i> Konfirmasi Komitmen
      </button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="auth.js"></script>
<script src="layout.js"></script>
<script src="push-notif.js"></script>
<script src="reports-utils.js"></script>
<script src="notifications.js"></script>
<script src="offline-sync.js"></script>
<script src="pc.js"></script>
</body>
</html>
