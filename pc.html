<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Personal Contact - ONE-SAP</title>
<link rel="icon" href="assets/Logo EBL.png" type="image/png" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="layout.css" />
<link rel="stylesheet" href="home.css" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
/* ═══════════════════════════════════════════════
   PC LIST PAGE
═══════════════════════════════════════════════ */
.pc-page { max-width: 860px; margin: 0 auto; padding: 12px 14px 80px; }

/* ── Page header ── */
.pc-page-header {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px; margin-bottom: 16px;
}
.pc-page-title {
  font-size: 1.05rem; font-weight: 800; color: #0f766e;
  display: flex; align-items: center; gap: 8px;
}
.pc-new-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 18px; border-radius: 12px;
  background: linear-gradient(135deg,#0f766e,#0d9488);
  color: #fff; font-size: .85rem; font-weight: 700;
  text-decoration: none; white-space: nowrap;
  box-shadow: 0 4px 12px rgba(15,118,110,.2);
}

/* ── Stats bar ── */
.pc-stats {
  display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
}
.pc-stat-card {
  flex: 1; min-width: 80px; padding: 12px 14px; border-radius: 12px;
  background: #fff; border: 1.5px solid #e2e8f0; text-align: center;
}
.pc-stat-num   { font-size: 1.4rem; font-weight: 800; color: #0f766e; }
.pc-stat-label { font-size: .7rem; color: #94a3b8; margin-top: 2px; }
.pc-stat-card.open   .pc-stat-num { color: #d97706; }
.pc-stat-card.closed .pc-stat-num { color: #059669; }

/* ── Tabs ── */
.pc-tabs {
  display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 14px;
}
.pc-tab {
  padding: 10px 18px; font-size: .85rem; font-weight: 600; color: #94a3b8;
  cursor: pointer; border-bottom: 2.5px solid transparent; margin-bottom: -2px;
  transition: all .2s; display: flex; align-items: center; gap: 6px;
}
.pc-tab.active { color: #0d9488; border-bottom-color: #0d9488; }
.pc-tab-count {
  padding: 2px 7px; border-radius: 20px; font-size: .68rem; font-weight: 700;
  background: #f1f5f9; color: #64748b;
}
.pc-tab.active .pc-tab-count { background: #ccfbf1; color: #0f766e; }

/* ── Filter bar ── */
.pc-filter-bar {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; margin-bottom: 14px;
}
@media (max-width: 480px) {
  .pc-filter-bar {
    grid-template-columns: 1fr;
  }
}
.pc-filter-bar input, .pc-filter-bar select {
  padding: 9px 12px; border: 1.5px solid #e2e8f0; border-radius: 10px;
  font-size: .83rem; background: #fff; color: #1e293b; width: 100%; box-sizing: border-box;
}
.pc-filter-bar input:focus, .pc-filter-bar select:focus {
  outline: none; border-color: #0d9488; box-shadow: 0 0 0 3px rgba(13,148,136,.1);
}

/* ── PC Card ── */
.pc-card {
  background: #fff; border-radius: 14px; border: 1.5px solid #e2e8f0;
  margin-bottom: 10px; overflow: hidden; transition: box-shadow .15s;
  display: flex;
}
.pc-card:hover { box-shadow: 0 4px 18px rgba(0,0,0,.08); }
.pc-card-accent { width: 4px; flex-shrink: 0; }
.pc-card-accent.open   { background: linear-gradient(180deg,#f59e0b,#fbbf24); }
.pc-card-accent.closed { background: linear-gradient(180deg,#059669,#10b981); }
.pc-card-body  { flex: 1; padding: 14px 16px; min-width: 0; }

.pc-card-top {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
}
.pc-card-id    { font-size: .7rem; font-weight: 700; color: #0d9488; letter-spacing:.05em; }
.pc-card-title { font-size: .95rem; font-weight: 700; color: #1e293b; margin-top: 2px; }
.pc-badge {
  padding: 4px 10px; border-radius: 20px; font-size: .7rem; font-weight: 700;
  white-space: nowrap; flex-shrink: 0;
}
.pc-badge.open   { background: #fef3c7; color: #92400e; }
.pc-badge.closed { background: #d1fae5; color: #065f46; }

.pc-card-meta {
  display: flex; flex-wrap: wrap; gap: 8px 14px;
  font-size: .76rem; color: #64748b; margin-top: 8px;
}
.pc-card-meta i { color: #0d9488; margin-right: 3px; }
.pc-card-topik {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 20px; font-size: .7rem; font-weight: 700;
  background: #f0fdfa; color: #0f766e;
}

.pc-card-footer {
  display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;
}
.pc-btn-detail {
  padding: 7px 14px; background: #f0fdfa; color: #0f766e;
  border: 1.5px solid #99f6e4; border-radius: 8px; font-size: .78rem;
  font-weight: 600; cursor: pointer; transition: background .15s;
}
.pc-btn-detail:hover { background: #ccfbf1; }
.pc-btn-komitmen {
  padding: 7px 16px;
  background: linear-gradient(135deg,#0f766e,#0d9488);
  color: #fff; border: none; border-radius: 8px; font-size: .78rem;
  font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
  box-shadow: 0 2px 8px rgba(15,118,110,.2);
}

/* ── Empty / Loading ── */
.pc-empty {
  text-align: center; padding: 60px 20px;
  background: #fff; border-radius: 14px; border: 1.5px dashed #e2e8f0;
  color: #94a3b8;
}
.pc-empty-icon { font-size: 2.5rem; margin-bottom: 12px; display: block; }
.pc-empty-title { font-size: .95rem; font-weight: 700; color: #64748b; margin-bottom: 6px; }
.pc-empty-sub   { font-size: .82rem; }
.pc-loading { text-align:center; padding:40px; color:#94a3b8; }

/* ── Modal overlay ── */
.pc-modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  display: none; align-items: flex-start; justify-content: center;
  z-index: 9999; padding: 20px; overflow-y: auto;
}
.pc-modal-overlay.open { display: flex; }
.pc-modal-box {
  background: #fff; border-radius: 20px; padding: 28px 24px;
  max-width: 520px; width: 100%; margin: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.15);
}
.pc-modal-title { font-size: 1rem; font-weight: 800; color: #0f766e; margin-bottom: 18px;
  display: flex; align-items: center; gap: 8px; }

.detail-row { display: flex; gap: 8px; margin-bottom: 9px; font-size: .84rem; }
.detail-label { font-weight: 700; color: #475569; min-width: 130px; flex-shrink: 0; }
.detail-value { color: #1e293b; flex: 1; }
.detail-divider { border: none; border-top: 1.5px solid #f1f5f9; margin: 12px 0; }

.pc-modal-close {
  margin-top: 18px; padding: 11px; width: 100%;
  border: 1.5px solid #e2e8f0; border-radius: 10px;
  background: #f8fafc; color: #475569; cursor: pointer; font-size: .85rem; font-weight: 600;
}
.pc-modal-close:hover { background: #f1f5f9; }

/* Komitmen form */
.komitmen-form-group { margin-bottom: 14px; }
.komitmen-form-group label { display: block; font-size: .82rem; font-weight: 700; color: #374151; margin-bottom: 6px; }
.komitmen-form-group input[type=file],
.komitmen-form-group textarea {
  width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 10px;
  font-size: .85rem; box-sizing: border-box;
}
.komitmen-submit-btn {
  flex: 2; padding: 11px; background: linear-gradient(135deg,#0f766e,#0d9488);
  color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer;
  font-size: .85rem; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.komitmen-cancel-btn {
  flex: 1; padding: 11px; border: 1.5px solid #e2e8f0; border-radius: 10px;
  background: #fff; cursor: pointer; font-size: .85rem; color: #475569;
}
.pc-err-inline {
  color: #dc2626; font-size: .8rem; padding: 8px 12px;
  background: #fff5f5; border-radius: 8px; margin-bottom: 10px; display: none;
}
</style>
</head>
<body>
<div class="app-layout">
  <aside id="appSidebar" class="app-sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <div class="app-main">

    <div class="app-topbar">
      <button class="app-topbar-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <span class="app-topbar-title">Personal Contact</span>
      <div id="notificationBell"></div>
      <div id="userProfile" class="user-menu"></div>
    </div>

    <div class="pc-page">

      <!-- Header -->
      <div class="pc-page-header">
        <div class="pc-page-title">
          <i class="fa-solid fa-comments"></i> Personal Contact
        </div>
        <a href="pc-form.html" class="pc-new-btn">
          <i class="fa-solid fa-plus"></i> Buat PC Baru
        </a>
      </div>

      <!-- Stats -->
      <div class="pc-stats">
        <div class="pc-stat-card">
          <div class="pc-stat-num" id="statTotal">-</div>
          <div class="pc-stat-label">Total</div>
        </div>
        <div class="pc-stat-card open">
          <div class="pc-stat-num" id="statOpen">-</div>
          <div class="pc-stat-label">Open</div>
        </div>
        <div class="pc-stat-card closed">
          <div class="pc-stat-num" id="statClosed">-</div>
          <div class="pc-stat-label">Closed</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="pc-tabs">
        <div class="pc-tab active" id="tabSemua" onclick="switchTab('semua')">
          <i class="fa-solid fa-list"></i> Semua
          <span class="pc-tab-count" id="countSemua">0</span>
        </div>
        <div class="pc-tab" id="tabCoach" onclick="switchTab('coach')">
          <i class="fa-solid fa-user-tie"></i> Saya Coach
          <span class="pc-tab-count" id="countCoach">0</span>
        </div>
        <div class="pc-tab" id="tabCoachee" onclick="switchTab('coachee')">
          <i class="fa-solid fa-user"></i> Saya Coachee
          <span class="pc-tab-count" id="countCoachee">0</span>
        </div>
      </div>

      <!-- Filter -->
      <div class="pc-filter-bar">
        <input type="search" id="pcSearch"
          placeholder="🔍 Cari nama, judul, ID..."
          oninput="renderPcList()" />
        <select id="pcFilterStatus" onchange="renderPcList()">
          <option value="">Semua Status</option>
          <option value="OPEN">Open</option>
          <option value="CLOSED">Closed</option>
        </select>
        <select id="pcFilterTopik" onchange="renderPcList()">
          <option value="">Semua Topik</option>
          <option value="Pekerjaan">🏗️ Pekerjaan</option>
          <option value="Pribadi">👤 Pribadi</option>
        </select>
      </div>

      <!-- List -->
      <div id="pcList" class="pc-loading">
        <i class="fa-solid fa-spinner fa-spin"></i> Memuat data...
      </div>

    </div>

    <nav id="mobileBottomNav" class="mobile-bottom-nav"></nav>
  </div>
</div>

<!-- Modal Detail -->
<div class="pc-modal-overlay" id="detailModal">
  <div class="pc-modal-box">
    <div class="pc-modal-title"><i class="fa-solid fa-comments"></i> Detail Personal Contact</div>
    <div id="detailContent"></div>
    <button class="pc-modal-close" onclick="closeModal('detailModal')">Tutup</button>
  </div>
</div>

<!-- Modal Konfirmasi Komitmen -->
<div class="pc-modal-overlay" id="komitmenModal">
  <div class="pc-modal-box">
    <div class="pc-modal-title"><i class="fa-solid fa-handshake"></i> Konfirmasi Komitmen</div>
    <p style="font-size:.84rem;color:#64748b;margin-bottom:16px;line-height:1.5">
      Upload foto sebagai bukti bahwa kamu telah melaksanakan komitmen perbaikan yang disepakati.
    </p>
    <input type="hidden" id="komitmenPcId" />

    <div class="komitmen-form-group">
      <label>Foto Bukti <span class="required">*</span></label>
      <input type="file" id="fotoBukti" accept="image/*" multiple onchange="onBuktiFotoChange(this)" />
      <div id="buktiFotoPreview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>
    </div>
    <div class="komitmen-form-group">
      <label>Catatan / Keterangan</label>
      <textarea id="pesanKomitmen" rows="2"
        placeholder="Opsional — tuliskan keterangan singkat..." style="resize:none"></textarea>
    </div>

    <div class="pc-err-inline" id="komitmenErr"></div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="komitmen-cancel-btn" onclick="closeModal('komitmenModal')">Batal</button>
      <button class="komitmen-submit-btn" id="komitmenSubmitBtn" onclick="submitKomitmen()">
        <i class="fa-solid fa-check"></i> Konfirmasi Komitmen
      </button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="auth.js"></script>
<script src="layout.js"></script>
<script src="push-notif.js"></script>
<script src="reports-utils.js"></script>
<script src="notifications.js"></script>
<script src="offline-sync.js"></script>
<script src="pc.js"></script>
</body>
</html>
