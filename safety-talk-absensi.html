<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Safety Talk - ONE-SAP</title>
  <link rel="icon" href="./assets/Logo EBL.png" type="image/png" />
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .st-info-card { background: linear-gradient(135deg,#6366f1,#4f46e5); color:#fff; border-radius:14px; padding:20px 24px; margin-bottom:18px; }
    .st-info-card h2 { font-size:1.05rem; font-weight:700; margin:0 0 8px; }
    .st-info-meta { font-size:.82rem; opacity:.85; display:flex; gap:16px; flex-wrap:wrap; }
    .st-ab-toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .st-ab-count { font-size:.85rem; color:#64748b; }
    .st-ab-count b { color:#6366f1; }
    .ab-cb { width:18px; height:18px; cursor:pointer; accent-color:#6366f1; }
    tr.checked td { background:#f0fdf4; }
    .btn-save { background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; border:none; border-radius:10px; padding:11px 24px; font-size:.9rem; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
    .btn-save:hover { opacity:.9; }
    .btn-save:disabled { opacity:.6; cursor:default; }
    .sticky-bar { position:sticky; bottom:0; background:#fff; border-top:1.5px solid #e2e8f0; padding:14px 0; z-index:10; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .back-link { display:inline-flex; align-items:center; gap:6px; color:#6366f1; font-size:.85rem; font-weight:600; text-decoration:none; margin-bottom:4px; }
    .back-link:hover { text-decoration:underline; }
    .toggle-all-btn { background:#f1f5f9; color:#374151; border:none; border-radius:8px; padding:7px 14px; font-size:.8rem; font-weight:600; cursor:pointer; }
    .toggle-all-btn:hover { background:#e2e8f0; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside id="appSidebar" class="app-sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <div class="app-main">
    <div class="app-topbar">
      <button class="app-topbar-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <span id="appTopbarTitle" class="app-topbar-title">Absensi Safety Talk</span>
      <div id="notificationBell"></div>
      <div id="userProfile" class="user-menu"></div>
    </div>

    <section class="admin-section">
      <a href="safety-talk.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Daftar Jadwal
      </a>

      <div id="stInfoCard" class="st-info-card" style="display:none"></div>

      <div class="admin-card" style="overflow-x:auto">
        <div class="st-ab-toolbar">
          <input type="text" id="abSearch" class="um-search" placeholder="Cari nama karyawan..." style="width:220px" oninput="filterTable()">
          <button class="toggle-all-btn" onclick="toggleAll()">Centang Semua / Batal</button>
          <span class="st-ab-count">Hadir: <b id="hadirCount">0</b> / <span id="totalCount">0</span></span>
        </div>
        <table class="admin-table" id="abTable">
          <thead>
            <tr>
              <th class="um-center" style="width:44px">Hadir</th>
              <th>Nama</th>
              <th>NIK</th>
              <th>Perusahaan</th>
              <th>Departemen</th>
              <th>Jabatan</th>
            </tr>
          </thead>
          <tbody id="abTbody">
            <tr><td colspan="6" class="um-loading">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="sticky-bar">
        <button class="btn-save" id="saveBtn" onclick="saveAbsensi()">
          <i class="fa-solid fa-floppy-disk"></i> Simpan Absensi
        </button>
        <span id="saveMsg" style="font-size:.82rem;color:#22c55e;display:none"></span>
      </div>
    </section>

    <nav id="mobileBottomNav" class="mobile-bottom-nav"></nav>
  </div>
</div>

<script src="auth.js"></script>
<script src="layout.js"></script>
<script src="push-notif.js"></script>
<script src="reports-utils.js"></script>
<script src="notifications.js"></script>
<script src="safety-talk-absensi.js"></script>
<script>
  requireLogin();
  window.addEventListener('DOMContentLoaded', () => {
    const user = getCurrentUser();
    if (!user) { window.location.href = 'login.html'; return; }
    const role = String(user.role || '').toUpperCase().replace(/\s+/g, '_');
    if (role !== 'ADMIN' && role !== 'SUPER_ADMIN') {
      window.location.href = 'index-home.html'; return;
    }
    initAbsensi();
  });
</script>
</body>
</html>
