<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Absensi Safety Talk - ONE-SAP</title>
  <link rel="icon" href="./assets/Logo EBL.png" type="image/png" />
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Info card */
    .st-info-card { background:linear-gradient(135deg,#6366f1,#4f46e5); color:#fff; border-radius:14px; padding:20px 24px; margin-bottom:18px; }
    .st-info-card h2 { font-size:1.05rem; font-weight:700; margin:0 0 8px; }
    .st-info-meta { font-size:.82rem; opacity:.85; display:flex; gap:16px; flex-wrap:wrap; }

    /* Peringatan quiz belum ada */
    .st-quiz-warn {
      background:#fffbeb; border:1.5px solid #fcd34d; border-radius:12px;
      padding:13px 16px; margin-bottom:16px; font-size:.82rem; color:#92400e;
      display:flex; align-items:flex-start; gap:10px; line-height:1.55;
    }
    .st-quiz-warn i { color:#d97706; margin-top:2px; flex-shrink:0; }

    /* Summary chips */
    .ab-summary { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .ab-chip { display:inline-flex; align-items:center; gap:5px; font-size:.78rem; font-weight:700; border-radius:20px; padding:4px 12px; }
    .ab-chip-hadir   { background:#dcfce7; color:#15803d; border:1px solid #86efac; }
    .ab-chip-quiz    { background:#ede9fe; color:#6d28d9; border:1px solid #c4b5fd; }
    .ab-chip-mangkir { background:#fee2e2; color:#b91c1c; border:1px solid #fca5a5; }
    .ab-chip-belum   { background:#fef3c7; color:#b45309; border:1px solid #fcd34d; }

    /* Toolbar & quick fill */
    .st-ab-toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .quick-fill { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
    .qf-btn { border:none; border-radius:8px; padding:5px 12px; font-size:.75rem; font-weight:700; cursor:pointer; }
    .qf-hadir       { background:#dcfce7; color:#15803d; }
    .qf-cuti        { background:#fef3c7; color:#92400e; }
    .qf-dinas-luar  { background:#e0f2fe; color:#0369a1; }
    .qf-shift-malam { background:#ede9fe; color:#6d28d9; }
    .qf-libur       { background:#ccfbf1; color:#0f766e; }
    .qf-security-jaga { background:#fce7f3; color:#be185d; }
    .qf-mangkir     { background:#fee2e2; color:#b91c1c; }

    /* Radio sebagai checkbox pill */
    .ab-radio-group { display:flex; gap:5px; flex-wrap:wrap; min-width:420px; }
    .ab-radio-label {
      display:inline-flex; align-items:center; gap:5px;
      border:1.5px solid #e2e8f0; border-radius:20px;
      padding:4px 11px; font-size:.75rem; font-weight:600;
      cursor:pointer; transition:all .12s; color:#64748b;
      background:#f8fafc; white-space:nowrap;
    }
    .ab-radio-label:hover { border-color:#94a3b8; background:#f1f5f9; }
    .ab-radio-label.ab-radio-selected { font-weight:700; }
    .ab-radio-label input[type=radio] { display:none; }

    /* Row tints */
    tr.ab-row-hadir       td { background:#f0fdf4; }
    tr.ab-row-cuti        td { background:#fefce8; }
    tr.ab-row-dinas_luar  td { background:#f0f9ff; }
    tr.ab-row-shift_malam td { background:#f5f3ff; }
    tr.ab-row-libur       td { background:#f0fdfa; }
    tr.ab-row-security_jaga td { background:#fdf2f8; }
    tr.ab-row-mangkir     td { background:#fff1f2; }

    /* Quiz cell */
    .ab-quiz-cell { white-space:nowrap; text-align:center; }
    .ab-quiz-na { color:#cbd5e1; font-size:.8rem; }
    .ab-quiz-loading { color:#94a3b8; font-size:.8rem; }
    .ab-quiz-locked { color:#dc2626; font-size:.78rem; font-weight:600; display:inline-flex; align-items:center; gap:4px; }
    .ab-quiz-lulus  { color:#16a34a; font-size:.8rem; font-weight:700; display:inline-flex; align-items:center; gap:4px; }
    .ab-quiz-belum  { color:#d97706; font-size:.8rem; font-weight:600; display:inline-flex; align-items:center; gap:4px; }

    /* Legend */
    .ab-legend { font-size:.74rem; color:#64748b; margin-bottom:12px; display:flex; gap:14px; flex-wrap:wrap; }
    .ab-legend-item { display:flex; align-items:center; gap:4px; }
    .ab-dot { width:9px; height:9px; border-radius:50%; }

    /* Sticky bar */
    .btn-save { background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; border:none; border-radius:10px; padding:11px 24px; font-size:.9rem; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
    .btn-save:hover { opacity:.9; }
    .btn-save:disabled { opacity:.6; cursor:default; }
    .btn-wa { background:#25d366; color:#fff; border:none; border-radius:10px; padding:11px 20px; font-size:.9rem; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
    .btn-wa:hover { opacity:.9; }
    .sticky-bar { position:sticky; bottom:0; background:#fff; border-top:1.5px solid #e2e8f0; padding:14px 0; z-index:10; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .back-link { display:inline-flex; align-items:center; gap:6px; color:#6366f1; font-size:.85rem; font-weight:600; text-decoration:none; margin-bottom:4px; }
    .back-link:hover { text-decoration:underline; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside id="appSidebar" class="app-sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <div class="app-main">
    <div class="app-topbar">
      <button class="app-topbar-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <span id="appTopbarTitle" class="app-topbar-title">Absensi Safety Talk</span>
      <div id="notificationBell"></div>
      <div id="userProfile" class="user-menu"></div>
    </div>

    <section class="admin-section">
      <a href="safety-talk.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Daftar Jadwal
      </a>

      <div id="stInfoCard" class="st-info-card" style="display:none"></div>

      <div id="stQuizWarn" class="st-quiz-warn" style="display:none"></div>

      <div class="admin-card" style="overflow-x:auto">

        <!-- Summary -->
        <div class="ab-summary" id="abSummary"><!-- diisi updateSummary() --></div>

        <!-- Toolbar -->
        <div class="st-ab-toolbar">
          <input type="text" id="abSearch" class="um-search" placeholder="Cari nama..." style="width:200px" oninput="filterTable()">
          <select id="abFilterStatus" class="um-search" style="width:140px" onchange="filterTable()">
            <option value="">Semua Status</option>
            <option value="HADIR">Hadir</option>
            <option value="CUTI">Cuti</option>
            <option value="DINAS_LUAR">Dinas Luar</option>
            <option value="SHIFT_MALAM">Shift Malam</option>
            <option value="LIBUR">Off</option>
            <option value="SECURITY_JAGA">Security Jaga</option>
            <option value="MANGKIR">Mangkir</option>
          </select>
        </div>

        <!-- Quick fill -->
        <div class="quick-fill">
          <span style="font-size:.75rem;color:#94a3b8">Isi semua:</span>
          <button class="qf-btn qf-hadir"       onclick="isiSemua('HADIR')">✓ Hadir</button>
          <button class="qf-btn qf-cuti"         onclick="isiSemua('CUTI')">Cuti</button>
          <button class="qf-btn qf-dinas-luar"   onclick="isiSemua('DINAS_LUAR')">Dinas Luar</button>
          <button class="qf-btn qf-shift-malam"  onclick="isiSemua('SHIFT_MALAM')">Shift Malam</button>
          <button class="qf-btn qf-libur"         onclick="isiSemua('LIBUR')">Off</button>
          <button class="qf-btn qf-security-jaga" onclick="isiSemua('SECURITY_JAGA')">Security Jaga</button>
          <button class="qf-btn qf-mangkir"       onclick="isiSemua('MANGKIR')">Mangkir</button>
        </div>

        <!-- Legend -->
        <div class="ab-legend">
          <span class="ab-legend-item"><span class="ab-dot" style="background:#16a34a"></span> Hadir = capaian penuh</span>
          <span class="ab-legend-item"><span class="ab-dot" style="background:#7c3aed"></span> Cuti/Dinas/Shift/Off + lulus quiz = capaian penuh</span>
          <span class="ab-legend-item"><span class="ab-dot" style="background:#dc2626"></span> Mangkir = 0 capaian (boleh kuis, tidak dihitung)</span>
        </div>

        <table class="admin-table" id="abTable">
          <thead>
            <tr>
              <th>Nama / NIK</th>
              <th>Departemen</th>
              <th>Jabatan</th>
              <th>Status Kehadiran</th>
              <th style="text-align:center;width:100px">Quiz</th>
            </tr>
          </thead>
          <tbody id="abTbody">
            <tr><td colspan="5" class="um-loading">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="sticky-bar">
        <button class="btn-save" id="saveBtn" onclick="saveAbsensi()">
          <i class="fa-solid fa-floppy-disk"></i> Simpan Absensi
        </button>
        <button class="btn-wa" id="waBtn" onclick="salinRekapWA()">
          <i class="fa-brands fa-whatsapp"></i> Salin Rekap WA
        </button>
        <span id="saveMsg" style="font-size:.82rem;color:#22c55e;display:none"></span>
      </div>
    </section>

    <nav id="mobileBottomNav" class="mobile-bottom-nav"></nav>
  </div>
</div>

<script src="auth.js"></script>
<script src="layout.js"></script>
<script src="push-notif.js"></script>
<script src="reports-utils.js"></script>
<script src="notifications.js"></script>
<script src="safety-talk-absensi.js"></script>
<script>
  requireLogin();
  window.addEventListener('DOMContentLoaded', () => {
    const user = getCurrentUser();
    if (!user) { window.location.href = 'login.html'; return; }
    const role = String(user.role || '').toUpperCase().replace(/\s+/g, '_');
    if (role !== 'ADMIN' && role !== 'SUPER_ADMIN') {
      window.location.href = 'index-home.html'; return;
    }
    initAbsensi();
  });
</script>
</body>
</html>
