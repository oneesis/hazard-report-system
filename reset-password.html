<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Ganti Password — ONE-SAP</title>
  <style>
    :root { --navy:#1e2a52; --gold:#f0b429; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(160deg,#12183a,#1e2a52);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; color:#0f172a; overflow-x: hidden;
    }
    .card {
      background:#fff; width:100%; max-width:420px; border-radius:16px;
      box-shadow:0 20px 60px rgba(0,0,0,.35); padding:28px 24px;
    }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
    .brand .logo { width:40px; height:40px; border-radius:10px; background:var(--gold);
      color:var(--navy); font-weight:800; display:flex; align-items:center; justify-content:center; }
    .brand b { color:var(--navy); font-size:18px; letter-spacing:.5px; }
    h1 { font-size:20px; margin:0 0 4px; color:var(--navy); }
    p.sub { margin:0 0 20px; color:#64748b; font-size:14px; }
    label { display:block; font-size:12px; font-weight:700; color:#475569; text-transform:uppercase;
      letter-spacing:.5px; margin:14px 0 6px; }
    .shell { position:relative; }
    input[type=password], input[type=text] {
      width:100%; height:46px; border:1px solid #e2e8f0; border-radius:10px; padding:0 42px 0 14px;
      font-size:16px; outline:none; background:#f8fafc;
    }
    input:focus { border-color:var(--navy); box-shadow:0 0 0 3px rgba(30,42,82,.12); background:#fff; }
    .toggle { position:absolute; right:8px; top:7px; width:32px; height:32px; border:0; background:transparent;
      cursor:pointer; color:#94a3b8; font-size:15px; }
    .hint { font-size:12px; color:#94a3b8; margin-top:6px; }
    button.submit {
      width:100%; height:48px; margin-top:22px; border:0; border-radius:10px; cursor:pointer;
      background:var(--gold); color:var(--navy); font-weight:800; font-size:16px; letter-spacing:.3px;
    }
    button.submit:disabled { opacity:.6; cursor:default; }
    .msg { margin-top:16px; font-size:14px; text-align:center; min-height:20px; }
    .msg.err { color:#dc2626; } .msg.ok { color:#15803d; }
    a.back { display:inline-block; margin-top:16px; color:var(--navy); font-size:14px; text-decoration:none; font-weight:600; }
    .center { text-align:center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="logo">H</span><b>ONE-SAP</b></div>
    <h1>Ganti Password</h1>
    <p class="sub">Buat password baru untuk akun kamu.</p>

    <form id="form">
      <label for="pw">Password Baru</label>
      <div class="shell">
        <input id="pw" type="password" autocomplete="new-password" placeholder="Minimal 8 karakter" required />
        <button type="button" class="toggle" data-for="pw" aria-label="Tampilkan">👁</button>
      </div>
      <label for="pw2">Ulangi Password Baru</label>
      <div class="shell">
        <input id="pw2" type="password" autocomplete="new-password" placeholder="Ketik ulang password" required />
        <button type="button" class="toggle" data-for="pw2" aria-label="Tampilkan">👁</button>
      </div>
      <div class="hint">Gunakan kombinasi huruf & angka. Hindari password yang mudah ditebak.</div>
      <button type="submit" class="submit" id="btn">Simpan Password Baru</button>
    </form>

    <div id="msg" class="msg"></div>
    <div class="center"><a class="back" href="login.html">← Kembali ke Login</a></div>
  </div>

  <script>
    const BASE_URL = "/api";
    const params = new URLSearchParams(location.search);
    const nik = (params.get("nik") || "").trim();
    const token = (params.get("token") || "").trim();
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    document.querySelectorAll(".toggle").forEach((t) => {
      t.addEventListener("click", () => {
        const el = document.getElementById(t.dataset.for);
        el.type = el.type === "password" ? "text" : "password";
      });
    });

    if (!nik || !token) {
      form.style.display = "none";
      msg.className = "msg err";
      msg.textContent = "Tautan tidak valid. Minta ulang link ganti password dari halaman login.";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw = document.getElementById("pw").value;
      const pw2 = document.getElementById("pw2").value;
      msg.className = "msg";
      msg.textContent = "";
      if (pw.length < 8) { msg.className = "msg err"; msg.textContent = "Password minimal 8 karakter."; return; }
      if (pw !== pw2) { msg.className = "msg err"; msg.textContent = "Password tidak sama."; return; }
      btn.disabled = true; btn.textContent = "Menyimpan...";
      try {
        const res = await fetch(BASE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "resetPassword", data: { nik, token, new_password: pw } }),
        });
        const result = await res.json();
        if (result.status !== "success") throw new Error(result.message || "Gagal mengganti password.");
        msg.className = "msg ok";
        msg.textContent = result.message + " Mengarahkan ke halaman login...";
        form.style.display = "none";
        setTimeout(() => (location.href = "login.html"), 1800);
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = err.message;
      } finally {
        btn.disabled = false; btn.textContent = "Simpan Password Baru";
      }
    });
  </script>
</body>
</html>
