<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capaian SAP - ONE-SAP</title>
  <link rel="icon" href="./assets/Logo EBL.png" type="image/png" />
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="app-layout">
  <aside id="appSidebar" class="app-sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app-main">
    <div class="app-topbar">
      <button class="app-topbar-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <span id="appTopbarTitle" class="app-topbar-title">Capaian SAP</span>
      <div id="notificationBell"></div>
      <div id="userProfile" class="user-menu"></div>
    </div>

    <section class="admin-section">
      <div class="um-header">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <input type="month" id="capMonth" class="um-search" style="width:160px" onchange="computeAndRender()">
          <select id="capDept" class="um-search" style="width:180px" onchange="computeAndRender()">
            <option value="">Semua Departemen</option>
          </select>
          <div id="capPerusahaanWrap">
            <select id="capPerusahaan" class="um-search" style="width:180px" onchange="computeAndRender()">
              <option value="">Semua Perusahaan</option>
            </select>
          </div>
        </div>
        <div class="um-header-actions">
          <button class="btn-secondary" id="capWaBtn" onclick="copyWa()" title="Salin rekap karyawan belum 100% untuk WA group">
            <i class="fa-brands fa-whatsapp"></i> Salin ke WA
          </button>
          <button class="btn-secondary" onclick="exportCsv()">
            <i class="fa-solid fa-file-arrow-down"></i> Download CSV
          </button>
          <button class="btn-secondary btn-icon" onclick="loadCapaian()" title="Refresh">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
        </div>
      </div>

      <div id="capKpi" class="ach-kpi-row" style="display:none"></div>

      <!-- Grafik capaian per perusahaan / departemen (ADMIN ke atas) -->
      <div id="capChartWrap" style="display:none;margin-top:12px">
        <div class="admin-card" style="padding:20px 24px">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px">
            <div>
              <div id="capChartTitle" style="font-size:.95rem;font-weight:700;color:#0f172a;letter-spacing:-.01em"></div>
              <div id="capChartSubtitle" style="font-size:.76rem;color:#94a3b8;margin-top:3px"></div>
            </div>
            <button id="capChartBack" onclick="capChartBack()" style="display:none" class="btn-secondary">
              <i class="fa-solid fa-arrow-left"></i> Kembali
            </button>
          </div>
          <canvas id="capChart" style="max-height:260px"></canvas>
          <div style="display:flex;gap:20px;justify-content:center;margin-top:14px;flex-wrap:wrap">
            <span style="display:flex;align-items:center;gap:5px;font-size:.73rem;color:#64748b">
              <span style="width:11px;height:11px;border-radius:3px;background:linear-gradient(180deg,rgba(34,197,94,.95),rgba(16,185,129,.55));display:inline-block;flex-shrink:0"></span>≥ 100%
            </span>
            <span style="display:flex;align-items:center;gap:5px;font-size:.73rem;color:#64748b">
              <span style="width:11px;height:11px;border-radius:3px;background:linear-gradient(180deg,rgba(245,158,11,.95),rgba(251,191,36,.55));display:inline-block;flex-shrink:0"></span>50 – 99%
            </span>
            <span style="display:flex;align-items:center;gap:5px;font-size:.73rem;color:#64748b">
              <span style="width:11px;height:11px;border-radius:3px;background:linear-gradient(180deg,rgba(239,68,68,.95),rgba(248,113,113,.55));display:inline-block;flex-shrink:0"></span>&lt; 50%
            </span>
            <span style="display:flex;align-items:center;gap:5px;font-size:.73rem;color:#64748b">
              <span style="width:20px;height:2px;background:repeating-linear-gradient(to right,#6366f1 0,#6366f1 5px,transparent 5px,transparent 9px);display:inline-block;flex-shrink:0"></span>Target 100%
            </span>
          </div>
        </div>
      </div>

      <div class="admin-card" style="overflow-x:auto;margin-top:12px">
        <table id="capTable" class="admin-table">
          <thead id="capTableHead"></thead>
          <tbody id="capTableBody">
            <tr><td colspan="12" class="um-loading">Memuat data...</td></tr>
          </tbody>
        </table>
        <div id="capPagination" class="table-pagination"></div>
      </div>
    </section>

    <nav id="mobileBottomNav" class="mobile-bottom-nav"></nav>
  </div>
</div>

<script src="auth.js"></script>
<script src="layout.js"></script>
<script src="push-notif.js"></script>
<script src="reports-utils.js"></script>
<script src="notifications.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="capaian-sap.js"></script>
<script>
  requireLogin();
  window.addEventListener('DOMContentLoaded', () => {
    const user = getCurrentUser();
    if (!user) { window.location.href = 'login.html'; return; }
    if (!isSuperAdminRole(user.role)) {
      document.getElementById('capPerusahaanWrap').style.display = 'none';
    }
    // Default ke bulan ini
    const now = new Date();
    document.getElementById('capMonth').value =
      `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    loadCapaian();
  });
</script>
</body>
</html>
